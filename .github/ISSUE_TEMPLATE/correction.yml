name: Correct an entry
description: Report a dead link, wrong license, bad fit, or stale project
title: "[Correction]: "
labels: ["correction"]
body:
  - type: input
    id: entry
    attributes:
      label: Entry
      placeholder: "Figma -> Penpot"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong?
    validations:
      required: true
  - type: input
    id: evidence
    attributes:
      label: Upstream evidence
      placeholder: https://...
