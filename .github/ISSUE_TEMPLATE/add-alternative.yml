name: Add an open-source alternative
description: Propose a new mapping or project for the catalog
title: "[Add]: "
labels: ["addition"]
body:
  - type: input
    id: proprietary
    attributes:
      label: Proprietary / licensed product
    validations:
      required: true
  - type: input
    id: project
    attributes:
      label: Open-source project
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Official project/source URL
      placeholder: https://...
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Official install / quick-start / usage URL
      placeholder: https://...
    validations:
      required: true
  - type: input
    id: platforms
    attributes:
      label: Supported platforms
      placeholder: Windows, macOS, Linux, Web, Docker...
    validations:
      required: true
  - type: textarea
    id: limitations
    attributes:
      label: Important limitations / things to know
      description: Keep these short and decision-useful, e.g. "Linux only", "Self-hosting required", "GPU recommended".
    validations:
      required: true
